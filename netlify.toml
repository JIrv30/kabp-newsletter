[build]
  command = "npm run build"
  publish = "dist"

# Firebase web config is public by design (it ships in the JS bundle), so stop Netlify's secrets scanner flagging it
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET"

# Send every path to index.html so React Router can handle it (otherwise a refresh on /admin etc. 404s)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
